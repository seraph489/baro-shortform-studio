<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>바로 숏폼 그래픽 레이어</title>
<!-- 바로 숏폼 공통 그래픽 레이어 (스타일 01·02 공용). 제목·자막·한두 단어 자막·핵심어(팝/손글씨/사람 뒤)·기준 패널·마무리 3단·팔로우 카드·인셋을 plan.json으로 켜고 끈다. plan.json(출력 시각 기준)을 window.PLAN 으로 받아 renderAt(t)로 그린다.
     인물 영상은 여기 없다: 투명 PNG로 캡처해 compose 단계에서 인물 위에 얹는다. -->
<style>
  @font-face { font-family: "BaroHand"; src: url("__HAND_FONT_URL__") format("truetype"); font-display: block; }
  @font-face { font-family: "Pretendard"; src: url("__FONT_URL__") format("woff2"); font-weight: 45 920; font-display: block; }
  :root { --teal:#0F5C5A; --coral:#F2795B; --coral-soft:#FFB39F; --ivory:#F6F1E8; --ink:#1D2B2A; --shadow:0 3px 6px rgba(0,0,0,.6); }
  * { margin:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; background:transparent; overflow:hidden; font-family:"Pretendard", sans-serif; color:#fff; }
  .ev { position:absolute; left:40px; right:40px; top:1190px; display:none; text-align:center; text-shadow:var(--shadow); }
  .ev .w { display:inline-block; transform-origin:50% 60%; }
  .ch { display:inline-block; }
  .body   { font-size:56px; font-weight:500; line-height:1.3; letter-spacing:-.5px; }
  .impact { font-size:104px; font-weight:700; line-height:1.15; letter-spacing:-2.5px; }
  .ev small { font-size:.62em; font-weight:500; }
  .k { color:var(--coral-soft); font-weight:800; }

  /* 배경이 복잡하면 글자 테두리 (자막 위치 가이드) */
  body.outline .ev, body.outline .title, body.outline #kw, body.outline #cta { paint-order: stroke fill; -webkit-text-stroke: 9px rgba(0,0,0,.85); }
  body.outline .badge { -webkit-text-stroke: 0; }

  /* 07: 손글씨 draw-in — 글자마다 마스크가 왼쪽→오른쪽으로 열리며 써지는 느낌 */
  .hand { position:absolute; display:none; font-family:"BaroHand", cursive; line-height:1.0; white-space:nowrap; transform-origin:50% 50%; }
  .hand .hc { display:inline-block; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; }
  .hand.navy { color:#1E2A5A; text-shadow:0 0 18px rgba(255,255,255,.55); }
  .hand.white { color:#fff; text-shadow:0 4px 16px rgba(0,0,0,.5); }
  .hand.coral { color:var(--coral); text-shadow:0 0 16px rgba(255,255,255,.5); }
  /* 07: 머리 위 자막 (subs_layout: "top") */
  body.subs-top .ev { top:250px; font-size:46px; font-weight:600; letter-spacing:-.5px; }
  body.subs-top .ev .k { font-weight:800; }
  body.subs-top.subs-navy .ev { color:#1E2A5A; text-shadow:0 0 14px rgba(255,255,255,.6); }
  body.subs-top.subs-navy .ev .k { color:#D9532F; }

  /* 옵션: 시청자 질문 말풍선 (Chat drop) — 위에서 떨어져 살짝 튕기며 멈춤. 아이콘: Tabler Icons(MIT) */
  #chat { position:absolute; left:120px; right:120px; top:250px; display:none; }
  #chat .bub { position:relative; background:#fff; color:#1D2B2A; border-radius:36px; padding:26px 34px 30px 34px; box-shadow:0 14px 36px rgba(0,0,0,.35); }
  #chat .bub::after { content:""; position:absolute; left:70px; bottom:-22px; border:22px solid transparent; border-top-color:#fff; border-bottom:0; border-left:0; }
  #chat .who { display:flex; align-items:center; gap:14px; font-size:28px; font-weight:700; color:#5F6B72; margin-bottom:10px; }
  #chat .who i { width:50px; height:50px; border-radius:50%; background:#E7ECEF; display:flex; align-items:center; justify-content:center; color:#8A969D; }
  #chat .who i svg { width:32px; height:32px; }
  #chat .who .tag { margin-left:auto; color:var(--teal); display:flex; align-items:center; gap:6px; font-size:26px; }
  #chat .who .tag svg { width:30px; height:30px; }
  #chat .q { font-size:52px; font-weight:800; line-height:1.22; letter-spacing:-1.2px; }
  #chat .q em { font-style:normal; color:var(--coral); }

  /* 06: 위쪽 후킹 헤드라인 (첫 몇 초 고정, 위 띠 12% 아래) */
  #headline { position:absolute; left:120px; right:120px; top:250px; text-align:center; display:none; font-size:68px; font-weight:900; line-height:1.12; letter-spacing:-1.5px;
    color:#fff; paint-order:stroke fill; -webkit-text-stroke:10px rgba(0,0,0,.75); text-shadow:0 4px 14px rgba(0,0,0,.45); }
  #headline .k { color:var(--coral-soft); } #headline .m { color:#7FE0D3; } #headline .x { color:#C9CDD1; text-decoration:line-through; text-decoration-thickness:6px; }
  /* 06: 한두 단어 큰 자막 */
  .ev.word { font-size:84px; font-weight:900; letter-spacing:-1px; line-height:1.1; paint-order:stroke fill; -webkit-text-stroke:10px rgba(0,0,0,.7); text-shadow:0 4px 12px rgba(0,0,0,.45); }
  .ev.word .k { color:var(--coral-soft); }
  /* 06: 사진 인셋 (자막 아래, 안전구역 아래 끝 y1500 위) */
  .inset { position:absolute; left:220px; width:640px; top:1300px; height:200px; border-radius:26px; overflow:hidden; display:none; box-shadow:0 10px 30px rgba(0,0,0,.4); border:4px solid #fff; background:#222; }
  .inset img { width:100%; height:100%; object-fit:cover; display:block; }
  /* 사진 카드 (photos[]): 장치 사진 + 이름표, 옆에서 날아와 붙음. 환자 얼굴·이름 금지 */
  .photo { position:absolute; width:390px; display:none; background:#fff; border-radius:28px; padding:14px 14px 0; box-shadow:0 14px 36px rgba(0,0,0,.35); transform-origin:50% 50%; }
  .photo img { width:100%; height:290px; object-fit:cover; display:block; border-radius:18px; }
  .photo .lb { font:800 44px/1 "Pretendard"; color:#1E2A5A; text-align:center; padding:18px 0 20px; letter-spacing:-.02em; }
  #phead { position:absolute; left:0; right:0; top:985px; text-align:center; display:none; font:800 50px/1.2 "Pretendard"; color:#fff; text-shadow:0 3px 14px rgba(0,0,0,.6); letter-spacing:-.02em; }
  #phead b { color:var(--coral); }
  .photo .tg { font:700 30px/1 "Pretendard"; color:var(--coral); text-align:center; margin:-8px 0 0; padding:0 0 20px; }
  /* 06: 팔로우 카드 */
  #follow { position:absolute; left:50%; top:1400px; transform:translateX(-50%); display:none; align-items:center; gap:14px; background:#fff; color:#1D2B2A; border-radius:999px; padding:12px 18px 12px 12px; font-size:34px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.35); white-space:nowrap; }
  #follow i { width:56px; height:56px; border-radius:50%; background:conic-gradient(var(--coral), #7FE0D3, var(--teal), var(--coral)); display:inline-block; }
  #follow .ft { display:flex; flex-direction:column; line-height:1.15; }
  #follow small { font-size:24px; font-weight:500; color:#5F6B72; margin-top:4px; }
  #follow small:empty { display:none; }
  #follow b { background:#ECEFF1; color:#555; font-size:26px; padding:8px 16px; border-radius:12px; font-weight:700; }

  /* 제목 + 배지: 가슴 위치, 첫 대사 전까지 */
  #title { top:1110px; }
  .badge { display:inline-block; background:var(--teal); font-size:44px; font-weight:800; padding:12px 26px; border-radius:28px; text-shadow:none; box-shadow:0 4px 14px rgba(0,0,0,.35); transform:skewX(-10deg); margin-bottom:18px; }
  .title { font-size:118px; font-weight:900; line-height:1.0; letter-spacing:-3px; transform:skewX(-12deg); text-shadow:0 6px 12px rgba(0,0,0,.65); }
  .title em { font-style:normal; color:var(--coral-soft); }

  /* 얼굴 앞 핵심어 팝 (머리 위쪽) */
  #kw { position:absolute; left:0; right:0; top:230px; text-align:center; display:none; font-size:310px; font-weight:900; letter-spacing:-8px; line-height:1; text-shadow:0 8px 28px rgba(10,67,66,.4); }
  #kw span { display:inline-block; transform-origin:50% 70%; }
  #kw em { font-style:normal; color:var(--coral-soft); }

  /* 기준 패널: 화면 40% 어둡게 + 입 아래~Reels 하단 안전선(y1536) 안 */
  #panel { position:absolute; inset:0; display:none; }
  #panel .dim { position:absolute; inset:0; background:rgba(0,0,0,.40); }
  #panel .box { position:absolute; left:189px; width:702px; top:1150px; height:350px; background:var(--ivory); border-radius:32px; padding:18px 36px; box-shadow:0 12px 40px rgba(0,0,0,.35); color:var(--ink); }
  #panel .ptitle { font-size:28px; font-weight:700; color:var(--teal); margin-bottom:6px; }
  .row { display:flex; align-items:center; gap:22px; height:88px; padding:0 22px; border-radius:22px; opacity:.35; }
  .row.on { opacity:1; }
  .row.now { background:var(--teal); color:#fff; }
  .row b { width:64px; height:64px; border-radius:50%; background:var(--coral); color:#fff; font-size:36px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .row span { font-size:52px; font-weight:800; letter-spacing:-1.5px; flex:1; display:inline-block; transform-origin:0 60%; }
  .ico { width:84px; height:56px; flex:none; position:relative; }
  .gum::before { content:""; position:absolute; left:4px; right:4px; top:4px; height:24px; border-radius:14px 14px 4px 4px; background:#F2A08C; }
  .gum::after { content:""; position:absolute; left:14px; right:14px; top:22px; height:30px; background:repeating-linear-gradient(90deg,#fff 0 16px,transparent 16px 22px); border-radius:0 0 8px 8px; }
  .pos::before { content:""; position:absolute; inset:6px 2px; border-bottom:6px solid currentColor; border-radius:0 0 50% 50%; opacity:.5; }
  .pos::after { content:""; position:absolute; left:34px; top:2px; width:16px; height:30px; background:#fff; border:3px solid currentColor; border-radius:6px 6px 10px 10px; }
  .tilt::before { content:""; position:absolute; left:6px; top:8px; width:16px; height:30px; background:#fff; border:3px solid currentColor; border-radius:6px; transform:rotate(-14deg); }
  .tilt::after { content:""; position:absolute; left:46px; top:12px; width:16px; height:30px; background:#fff; border:3px solid currentColor; border-radius:6px; transform:rotate(18deg); }
  .check::before { content:""; position:absolute; left:22px; top:6px; width:22px; height:40px; border:solid currentColor; border-width:0 8px 8px 0; transform:rotate(40deg); }
  .none { display:none; }

  /* 마무리 3단 (M09) */
  #cta { position:absolute; left:0; right:0; top:1090px; height:330px; display:none; text-shadow:var(--shadow); }
  #cta .l { position:absolute; left:250px; top:0; font-size:52px; font-weight:500; transform:skewX(-8deg); }
  #cta .kk { position:absolute; left:0; right:0; top:62px; text-align:center; font-size:142px; font-weight:900; letter-spacing:-4px; color:var(--coral-soft); }
  #cta .kk span { display:inline-block; transform-origin:50% 60%; }
  #cta .t { position:absolute; left:420px; top:232px; font-size:52px; font-weight:500; white-space:pre; }
  /* 레퍼런스 효과 (plan.fx[]) */
  .fx { position:absolute; display:none; }
  .ui { left:190px; width:700px; background:rgba(248,248,250,.97); border-radius:34px; padding:22px 26px 10px; box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .ui .uh { font:800 40px/1.2 "Pretendard"; color:#1E2A5A; padding:4px 6px 14px; }
  .ui .ur { display:flex; align-items:center; gap:20px; padding:16px 6px; border-top:2px solid #e6e6ea; font:700 40px/1 "Pretendard"; color:#1E2A5A; }
  .ui .ur i { width:62px; height:62px; border-radius:16px; background:#b9c0c8; display:flex; align-items:center; justify-content:center; }
  .ui .ur.on i { background:var(--teal, #1F6F64); }
  .ui .ur b { margin-left:auto; color:#8a8f98; font-weight:600; }
  .phone { width:260px; height:540px; border-radius:52px; background:#111; padding:16px; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .phone .notch { position:absolute; left:90px; top:22px; width:80px; height:20px; border-radius:10px; background:#000; z-index:2; }
  .phone .scr { width:100%; height:100%; border-radius:38px; overflow:hidden; background:#f3f4f6; }
  .phone .scr img { width:100%; height:100%; object-fit:cover; }
  .phone .pl { padding:70px 18px; }
  .phone .pl p { margin:0 0 16px; padding:14px 18px; background:#fff; border-radius:20px; font:600 26px/1.3 "Pretendard"; color:#1E2A5A; max-width:80%; }
  .phone .pl p.me { margin-left:auto; background:var(--teal, #1F6F64); color:#fff; }
  .freebie { left:280px; width:520px; background:#fff; border-radius:24px; padding:36px 40px; box-shadow:0 22px 48px rgba(0,0,0,.4); border-top:18px solid var(--coral, #F26B5B); }
  .freebie .fb-b { display:inline-block; margin:14px 0 12px; padding:8px 16px; border-radius:30px; background:#FDECE9; color:var(--coral, #F26B5B); font:800 28px/1 "Pretendard"; }
  .freebie .fb-t { font:900 54px/1.2 "Pretendard"; color:#1E2A5A; letter-spacing:-.02em; }
  .freebie .fb-s { margin-top:14px; font:600 30px/1.3 "Pretendard"; color:#6b7280; }
  .orb { width:180px; height:180px; border-radius:50%; overflow:hidden; border:6px solid #fff; box-shadow:0 10px 28px rgba(0,0,0,.4); }
  .orb img { width:100%; height:100%; object-fit:cover; }
  .hw { max-width:380px; padding:20px 24px; background:#fff; border-radius:10px; font:800 38px/1.25 "Pretendard"; color:#1E2A5A; box-shadow:0 12px 28px rgba(0,0,0,.35); border-left:10px solid var(--coral, #F26B5B); }
  .hw .k, .paper .k { color:var(--coral, #F26B5B); }
  .chart { left:140px; width:800px; background:rgba(255,255,255,.96); border-radius:30px; padding:26px 34px 18px; box-shadow:0 18px 40px rgba(0,0,0,.35); }
  .chart .ch-t { font:800 40px/1.2 "Pretendard"; color:#1E2A5A; }
  .chart .bars { display:flex; align-items:flex-end; justify-content:space-around; height:320px; }
  .chart .bar { display:flex; flex-direction:column; align-items:center; gap:10px; font:700 30px/1 "Pretendard"; color:#1E2A5A; }
  .chart .bar i { display:block; width:110px; height:0; border-radius:16px 16px 4px 4px; background:var(--teal, #1F6F64); }
  .chart .bar:last-child i { background:var(--coral, #F26B5B); }
  .chart .ch-s { margin-top:12px; font:500 22px/1 "Pretendard"; color:#8a8f98; text-align:right; }
  .iris { inset:0; }
  .paper { padding:22px 30px 22px 26px; background:#FFF9EC; font:800 44px/1.2 "Pretendard"; color:#1E2A5A; box-shadow:0 8px 18px rgba(0,0,0,.3); clip-path:polygon(0 4%, 6% 0, 14% 5%, 25% 1%, 38% 4%, 52% 0, 66% 5%, 79% 1%, 92% 4%, 100% 0, 99% 50%, 100% 96%, 88% 100%, 74% 95%, 60% 100%, 46% 96%, 32% 100%, 18% 95%, 6% 100%, 0 95%, 2% 50%); }
  .paper em { display:inline-flex; width:56px; height:56px; margin-right:14px; border-radius:50%; background:var(--coral, #F26B5B); color:#fff; font:900 34px/56px "Pretendard"; justify-content:center; font-style:normal; vertical-align:middle; }
  .cursor { z-index:5; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .ring { width:120px; height:120px; border-radius:50%; border:6px solid #fff; z-index:4; }
  .wallf { border:12px solid #2a2118; outline:4px solid #c9a96e; box-shadow:0 14px 30px rgba(0,0,0,.5); background:#000; }
  .wallf img { width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
<div class="ev" id="title"><div class="badge" id="badge"></div><div class="title" id="titleText"></div></div>
<div id="headline"></div>
<div id="chat"><div class="bub"><div class="who"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"/><path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"/></svg></i><span id="chatWho"></span><span class="tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1"/></svg><span id="chatTag"></span></span></div><div class="q" id="chatQ"></div></div></div>
<div id="kw"><span id="kwText"></span></div>
<div id="follow"><i></i><span class="ft"><span id="followText"></span><small id="followSub"></small></span><b>팔로우</b></div>
<div id="panel"><div class="dim"></div><div class="box"><div class="ptitle" id="ptitle"></div><div id="rows"></div></div></div>
<div id="cta"><div class="l" id="ctaL"></div><div class="kk"><span id="ctaK"></span></div><div class="t" id="ctaT"></div></div>
<script>
const P = window.PLAN || {};
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
// 자막 문구 표기: "**강조**" → 코랄, "//" → 줄바꿈, "_작게_" → small
const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<span class="k">$1</span>').replace(/_(.+?)_/g, "<small>$1</small>").replace(/\s*\/\/\s*/g, "<br>");
const lerp = (k, t) => { if (t <= k[0][0]) return k[0][1]; for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const [a, va] = k[i - 1], [b, vb] = k[i]; const x = (t - a) / (b - a); return va + (vb - va) * (1 - (1 - x) ** 2); } return k[k.length - 1][1]; };
const pop = (el, d) => { el.style.transform = `scale(${lerp([[0, 0], [.05, 1.25], [.117, .96], [.167, 1]], d)})`; el.style.opacity = lerp([[0, 0], [.05, 1]], d); };
const shake = (el, d, k) => { el.style.transform = `translateX(${lerp([[0, 90], [.05, -16], [.1, 6], [.2, 0]], d) * k}px) skewX(${lerp([[0, 14], [.05, -7], [.1, 3], [.2, 0]], d) * k}deg)`; el.style.opacity = lerp([[0, 0], [.05, 1]], d); };
const bounce = (el, d) => [...el.querySelectorAll(".ch")].forEach((c, i) => { const x = d - i * 0.033; c.style.transform = `translateY(${lerp([[0, -20], [.033, 4], [.1, 0]], x)}px) scale(${lerp([[0, .9], [.033, 1.1], [.1, 1]], x)})`; c.style.opacity = x < 0 ? 0 : lerp([[0, 0], [.033, 1]], x); });
const converge = (el, d) => [...el.querySelectorAll(".ch")].forEach((c, i) => { const x = d - i * 0.017; c.style.transform = `scale(${lerp([[0, .25], [.1, .7], [.2, 1]], x)})`; c.style.marginRight = `${lerp([[0, 18], [.1, 8], [.2, 0]], x)}px`; c.style.opacity = x < 0 ? 0 : lerp([[0, 0], [.1, .7], [.2, 1]], x); });

// 제목
if (P.title) {
  document.getElementById("badge").textContent = P.title.badge || P.series || "";
  document.getElementById("titleText").innerHTML = P.title.lines.map((l) => fmt(l).replace(/class="k"/g, "")).map((l) => l.replace(/<span >(.+?)<\/span>/g, "<em>$1</em>")).join("<br>");
}
// 자막
const SUBS = (P.subs || []).map((s) => {
  const el = document.createElement("div");
  el.className = "ev " + (s.word ? "word" : s.size === "impact" ? "impact" : "body");
  const chars = s.motion === "bounce" || s.motion === "converge";
  el.innerHTML = chars ? `<span class="w">${[...s.text].map((c) => `<span class="ch">${c === " " ? "&nbsp;" : esc(c)}</span>`).join("")}</span>` : `<span class="w">${fmt(s.text)}</span>`;
  document.body.appendChild(el);
  // 가로 안전구역(가운데 기준 폭 800px → x 140~940)을 넘는 긴 자막은 글자 크기를 줄인다
  el.style.display = "block";
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while (el.firstChild.getBoundingClientRect().width > 800 && fs > 36) { fs -= 4; el.style.fontSize = fs + "px"; }
  el.style.display = "none";
  return { ...s, el, w: el.firstChild };
});
// 핵심어
if (P.keyword) {
  const K = P.keyword, kw = document.getElementById("kw");
  document.getElementById("kwText").innerHTML = `${esc(K.text)}<em>${esc(K.mark ?? "?")}</em>`;
  if (K.top != null) kw.style.top = K.top + "px";

      if (f.type === "chart") f.parts.forEach((p, i) => (p.style.height = p.dataset.h * ease((d - 0.3 - i * 0.15) / 0.6) + "px"));
    } else if (f.type === "phone") {
      f.el.style.opacity = a; f.el.style.transform = `translateY(${(1 - ease(d / 0.45)) * 900}px) rotate(${(f.side === "left" ? -1 : 1) * 4}deg)`;
      f.parts.forEach((p, i) => (p.style.opacity = d > 0.5 + i * 0.5 ? 1 : 0));
    } else if (f.type === "orbit") {
      const [cx, cy] = f.center || [540, 330], rx = f.rx ?? 400, ry = f.ry ?? 90, n = f.parts.length;
      f.parts.forEach((p, i) => { const th = (d / (f.period ?? 4)) * 2 * Math.PI + (i / n) * 2 * Math.PI, z = Math.sin(th);
        p.style.left = cx + rx * Math.cos(th) - 90 + "px"; p.style.top = cy + ry * z - 90 + "px"; p.style.transform = `scale(${0.75 + 0.25 * (z + 1) / 2})`; p.style.zIndex = z > 0 ? 3 : 1; p.style.opacity = a * (0.6 + 0.4 * (z + 1) / 2); });
    } else if (f.type === "headline_wall" || f.type === "paper_cut") {
      f.parts.forEach((p, i) => { const k = d - i * (f.step ?? 0.25); p.style.display = k >= 0 ? "block" : "none"; p.style.opacity = a; p.style.transform = `rotate(${p.dataset.r}deg) scale(${lerp([[0, 1.6], [0.12, 0.94], [0.2, 1]], k)})`; });
    } else if (f.type === "iris") {   // mode open: 검은 화면에서 원이 커지며 열림 / close: 반대
      const k = ease(d / (f.dur ?? 0.6)), r = f.mode === "close" ? (f.min ?? 150) + (1250 - (f.min ?? 150)) * (1 - k) : k * 1250,   // 닫힘은 얼굴 둘레 원에서 멈춤 (완전 검은 화면은 Reels 검사 실패)
         [cx, cy] = f.center || [540, 760];
      f.el.style.background = `radial-gradient(circle at ${cx}px ${cy}px, transparent ${r}px, #0b0f14 ${r + 2}px)`;
    } else if (f.type === "cursor") {
      const pts = f.path || [[0, 700, 1300], [1, 540, 1000]];
      let x = pts[0][1], y = pts[0][2];
      for (let i = 1; i < pts.length; i++) if (d >= pts[i - 1][0]) { const k = ease((d - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0])); x = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * k; y = pts[i - 1][2] + (pts[i][2] - pts[i - 1][2]) * k; }
      f.el.style.left = x - 12 + "px"; f.el.style.top = y - 8 + "px"; f.el.style.opacity = a;
      const c = (f.clicks || []).filter((c) => d >= c && d < c + 0.5).pop();
      f.ring.style.display = c != null ? "block" : "none";
      if (c != null) { const k = (d - c) / 0.5; f.ring.style.left = x - 60 + "px"; f.ring.style.top = y - 60 + "px"; f.ring.style.transform = `scale(${0.3 + k})`; f.ring.style.opacity = 1 - k; }
    } else if (f.type === "couch_wall") {
      f.parts.forEach((p, i) => { const k = ease((d - i * 0.2) / 0.35); p.style.opacity = a * k; p.style.transform = `rotate(${p.dataset.r}deg) scale(${0.85 + 0.15 * k})`; });
    }
  }
}

// 렌더러가 프레임마다 겹침을 검사할 때 쓰는 함수
window.__overlaps = () => {
  const bs = textBoxes(), fo = document.getElementById("follow");
  if (visible(fo)) bs.push({ name: "팔로우 카드", box: fo.getBoundingClientRect() });
  const hits = [];
  for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) {
    const a = bs[i].box, b = bs[j].box;
    const oy = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top), ox = Math.min(a.right, b.right) - Math.max(a.left, b.left);
    if (oy > 6 && ox > 6) hits.push(`${bs[i].name} × ${bs[j].name}`);
  }
  return hits;
};
const _renderAt = window.renderAt;
window.renderAt = (t) => { _renderAt(t); if (LAYER !== "kw") drawFx(t); avoidFollow(); };
window.renderAt(0);
</script>
